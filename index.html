<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ito風 数字並べゲーム</title>
  <style>
    :root {
      --bg: #faf6ee;
      --card: #ffffff;
      --ink: #1e293b;
      --muted: #64748b;
      --border: #1e293b;
      --red: #ef4444;
      --blue: #3b82f6;
      --yellow: #f59e0b;
      --green: #10b981;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(#e5dec9 1px, transparent 1px);
      background-size: 16px 16px;
      color: var(--ink);
      margin: 0;
      padding: 14px;
      -webkit-tap-highlight-color: transparent;
    }

    .wrap {
      max-width: 460px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .topbar {
      background: var(--card);
      border: 2.5px solid var(--border);
      border-radius: 16px;
      padding: 10px 14px;
      box-shadow: 0 4px 0 var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }
    .topbar::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--red) 0% 25%, var(--yellow) 25% 50%, var(--green) 50% 75%, var(--blue) 75% 100%);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 900;
    }
    .brand-dots {
      display: inline-flex;
      gap: 3px;
    }
    .brand-dots i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      display: inline-block;
    }

    .card {
      background: var(--card);
      border: 2.5px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 4px 0 var(--border);
    }

    .row { display: flex; gap: 8px; align-items: center; }
    .col { display: flex; flex-direction: column; gap: 8px; }

    .sec-label {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
    }

    input {
      flex: 1;
      min-width: 0;
      background: #f8fafc;
      color: var(--ink);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 700;
      outline: none;
    }
    input:focus {
      background: #fffbeb;
      border-color: var(--blue);
    }

    button {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--border);
    }
    button:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--border);
    }

    .btn-primary {
      background: var(--blue);
      color: #ffffff;
      width: 100%;
      padding: 12px;
      font-size: 15px;
    }
    .btn-sub {
      background: #f1f5f9;
      color: var(--ink);
    }
    .btn-draw {
      background: #fef3c7;
      color: #92400e;
      padding: 6px 11px;
      font-size: 12px;
    }
    .btn-send {
      background: var(--yellow);
      color: var(--ink);
    }
    .btn-ok {
      background: var(--green);
      color: #ffffff;
      flex: 1;
      padding: 13px;
      font-size: 15px;
    }
    .btn-ng {
      background: var(--red);
      color: #ffffff;
      flex: 1;
      padding: 13px;
      font-size: 15px;
    }

    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      background: #f1f5f9;
      color: var(--ink);
      border: 1.5px solid var(--border);
    }
    .count-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      background: #dbeafe;
      color: #1e40af;
      border: 1.5px solid var(--border);
    }
    .game-pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      background: #fef3c7;
      color: #92400e;
      border: 1.5px solid var(--border);
    }
    .member-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }
    .member-chip {
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      background: #f8fafc;
      border: 1.5px solid var(--border);
      color: var(--ink);
    }
    .member-me {
      background: #fef3c7;
      color: #92400e;
    }

    .notice {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      min-height: 1.2em;
    }

    .theme-card {
      background: #fffdf7;
    }
    .theme-box {
      font-size: 17px;
      font-weight: 900;
      line-height: 1.45;
      padding: 12px;
      background: #fef9c3;
      border: 2px dashed #ca8a04;
      border-radius: 12px;
      color: #422006;
      text-align: center;
    }

    .card-stage {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      padding: 8px 0 4px;
    }
    .num-box {
      width: 152px;
      height: 204px;
      border-radius: 18px;
      border: 3px solid var(--border);
      background: #ffffff;
      box-shadow: 0 6px 0 var(--border);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .card-stage.is-multi .num-box {
      width: 132px;
      height: 180px;
    }
    .num-box::after {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      pointer-events: none;
    }
    .num-box.is-masked {
      background-color: #ef4444;
      background-image:
        repeating-linear-gradient(45deg, rgba(255,255,255,0.16) 0, rgba(255,255,255,0.16) 8px, transparent 8px, transparent 16px),
        repeating-linear-gradient(-45deg, rgba(255,255,255,0.16) 0, rgba(255,255,255,0.16) 8px, transparent 8px, transparent 16px);
    }
    .num-box.is-masked::after {
      border-color: rgba(255, 255, 255, 0.7);
    }
    .corner-num {
      position: absolute;
      font-size: 14px;
      font-weight: 900;
      color: var(--red);
      line-height: 1;
    }
    .corner-tl { top: 12px; left: 13px; }
    .corner-br { bottom: 12px; right: 13px; transform: rotate(180deg); }
    .num-val {
      font-size: 58px;
      font-weight: 900;
      color: var(--ink);
      line-height: 1;
      letter-spacing: -2px;
    }
    .card-stage.is-multi .num-val {
      font-size: 48px;
    }
    .card-sub-label {
      margin-top: 8px;
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
    }
    .mask-badge {
      background: #ffffff;
      color: var(--red);
      border: 2px solid var(--border);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 2px;
      box-shadow: 0 3px 0 var(--border);
    }

    .result-banner {
      margin-top: 12px;
      padding: 11px 12px;
      border-radius: 12px;
      border: 2px solid var(--border);
      font-weight: 900;
      font-size: 14px;
      text-align: center;
      display: none;
    }
    .result-ok {
      background: #d1fae5;
      color: #065f46;
    }
    .result-ng {
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <span class="brand-dots">
          <i style="background:#ef4444;"></i>
          <i style="background:#f59e0b;"></i>
          <i style="background:#10b981;"></i>
          <i style="background:#3b82f6;"></i>
        </span>
        <span>ito風 1-100</span>
      </div>
      <div class="row">
        <span id="memberCountBadge" class="count-pill">参加者 0人</span>
        <span id="badge" class="badge">準備完了</span>
      </div>
    </div>

    <div class="card col" style="gap:10px;">
      <div class="row" style="justify-content: space-between;">
        <span class="sec-label">プレイヤー名</span>
        <div class="row" style="gap:6px;">
          <span class="badge">1人 <strong id="handCountBadge">1</strong>枚</span>
          <span class="game-pill">第 <strong id="gameCount">1</strong> ゲーム</span>
        </div>
      </div>
      <form id="nicknameForm" class="row">
        <input id="nicknameInput" type="text" maxlength="20" placeholder="ニックネームを入力（例：たくみ）" />
        <button type="submit" class="btn-sub">確定</button>
      </form>
      <div id="memberList" class="member-list"></div>
    </div>

    <div class="card col" style="gap:10px;">
      <div class="row" style="justify-content: space-between;">
        <span class="sec-label">ルーム管理</span>
      </div>
      <button id="createRoomBtn" type="button" class="btn-primary">+ 新しいルームを作る（6桁ID発行）</button>
      <form id="joinRoomForm" class="row">
        <input id="joinRoomInput" type="text" maxlength="12" placeholder="ルームIDを入力（例：K7M2P9）" />
        <button type="submit" class="btn-sub">入る</button>
      </form>
      <div class="row" style="justify-content: space-between; background:#f8fafc; padding:8px 12px; border-radius:12px; border:1.5px solid #cbd5e1;">
        <div>
          <div style="font-size:11px; font-weight:700; color:var(--muted);">現在のルームID</div>
          <div id="roomIdDisp" style="font-size:19px; font-weight:900; letter-spacing:2px;">------</div>
        </div>
        <div class="row">
          <button id="copyIdBtn" type="button" class="btn-sub" style="padding:8px 10px; font-size:12px;">IDコピー</button>
          <button id="refreshBtn" type="button" class="btn-sub" style="padding:8px 10px; font-size:12px;">最新読込</button>
        </div>
      </div>
      <button id="copyInviteBtn" type="button" class="btn-sub" style="width:100%;">招待案内文をコピー</button>
      <div id="statusMsg" class="notice"></div>
    </div>

    <div class="card theme-card col">
      <div class="row" style="justify-content: space-between;">
        <span class="sec-label">今回のテーマ</span>
        <button id="drawThemeBtn" type="button" class="btn-draw">お題を引く</button>
      </div>
      <div id="themeDisp" class="theme-box">
        スーパー銭湯のあとに飲みたいもの
      </div>
      <form id="themeForm" class="row">
        <input id="themeInput" type="text" maxlength="120" placeholder="オリジナルお題を入力" />
        <button type="submit" class="btn-send">送信</button>
      </form>
    </div>

    <div class="card">
      <div class="row" style="justify-content: space-between;">
        <span class="sec-label">あなたのナンバーカード</span>
        <button id="maskAllBtn" type="button" class="btn-sub" style="padding:6px 11px; font-size:12px;">すべて隠す</button>
      </div>

      <div id="cardStage" class="card-stage"></div>

      <div id="resultBanner" class="result-banner"></div>

      <div id="judgeRow" class="row" style="margin-top:12px;">
        <button id="successBtn" type="button" class="btn-ok">成功</button>
        <button id="failBtn" type="button" class="btn-ng">失敗</button>
      </div>
      <button id="nextBtn" type="button" class="btn-primary" style="display:none; margin-top:12px;">次のゲームへ（お題も更新）</button>
    </div>
  </div>

  <script>
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbzZbmworRZD6ZO4Agg3I5KljhzFOiRqUmN36ahZ2P9lpOY9V-7lXGC5qBNJKiJ9l9Qy/exec';
    var SHARE_URL = 'https://ketsu7.github.io/ito-game/';
    var CHARS = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';

    var THEMES = [
      'スーパー銭湯のあとに飲みたいもの',
      '休日の昼下がりに飲みたいお酒',
      '深夜に食べたくなる背徳グルメ',
      '1000円以内で味わえる最高のご褒美',
      '旅行先で思わず買ってしまうお土産',
      '雨の日に聴きたくなる曲や歌',
      '無人島に1つだけ持っていくなら',
      '小学生のころに憧れていた職業や大人',
      '思わず二度見してしまうファッションや髪型',
      '初対面の人とすぐ打ち解けられる話題',
      'これがあると生活がちょっと豊かになるアイテム',
      '寝る前に考えがちで眠れなくなること',
      '漫画やアニメに出てきそうな必殺技やセリフ',
      'ちょっと気まずい沈黙が流れたときの空気感',
      'これは大人になったなと感じる瞬間',
      '冬の朝、布団から出られない理由',
      '夏の暑い日に一番うれしい瞬間',
      '居酒屋で最初に頼みがちなメニュー',
      'シメに食べたくなるもの',
      'コーヒーや紅茶を飲みたくなるシチュエーション',
      'ちょっとした贅沢を感じる外食',
      '意外と手間がかかるなと思うこと',
      '子どものころ怖かったものや苦手なもの',
      '旅先で出会ったらテンションが上がるもの',
      'ボードゲームやカードゲームで盛り上がる瞬間',
      'これだけは譲れないというこだわり',
      '気づいたら時間が溶けていること',
      'ちょっと背伸びしている感じがするお店や注文',
      '友達にすすめたい映画や作品や場所のテンション',
      'なんだか今日はツイていると感じる出来事',
      '今日は早めに帰ろうとなる出来事',
      'ギフトにもらったら嬉しいもの',
      '季節の変わり目に感じること',
      'それどういう意味とツッコミたくなる一言',
      'レトロや昭和っぽい雰囲気を感じるもの',
      '未来やSFっぽさを感じるもの',
      '静かに集中したいときに合う環境や音',
      'みんなでワイワイ騒ぎたいときの気分',
      '実はちょっと苦手かもと小声で言いたいこと',
      '明日への活力になる一言や出来事'
    ];

    function drawNum(usedSet) {
      var n = Math.floor(Math.random() * 100) + 1;
      if (!usedSet) return n;
      var guard = 0;
      while (usedSet[n] && guard < 200) {
        n = Math.floor(Math.random() * 100) + 1;
        guard++;
      }
      usedSet[n] = true;
      return n;
    }

    function dealHand(count) {
      var safeCount = Math.max(1, Math.min(5, Number(count) || 1));
      var used = {};
      var cards = [];
      for (var i = 0; i < safeCount; i++) {
        cards.push({
          value: drawNum(used),
          masked: false
        });
      }
      return cards;
    }

    var state = {
      roomId: '',
      nickname: '',
      members: [],
      serverMemberCount: null,
      theme: THEMES[0],
      lastThemeIndex: 0,
      gameCount: 1,
      cardsPerPlayer: 1,
      cards: dealHand(1),
      finished: false,
      lastResult: null
    };

    var syncTimer = null;
    var isSyncing = false;
    var reqSeq = 0;

    function setStatus(text, badgeText) {
      var s = document.getElementById('statusMsg');
      if (s) s.textContent = text || '';
      var b = document.getElementById('badge');
      if (b && badgeText) b.textContent = badgeText;
    }

    function genId() {
      var out = '';
      for (var i = 0; i < 6; i++) {
        out += CHARS[Math.floor(Math.random() * CHARS.length)];
      }
      return out;
    }

    function pickRandomTheme() {
      if (THEMES.length <= 1) return THEMES[0] || '今回のテーマ';
      var idx = Math.floor(Math.random() * THEMES.length);
      if (idx === state.lastThemeIndex) {
        idx = (idx + 1) % THEMES.length;
      }
      state.lastThemeIndex = idx;
      return THEMES[idx];
    }

    function normalizeMembers(raw) {
      if (!Array.isArray(raw)) return [];
      var seen = {};
      var list = [];
      for (var i = 0; i < raw.length; i++) {
        var item = raw[i];
        var name = typeof item === 'string'
          ? item
          : (item && (item.nickname || item.name) ? String(item.nickname || item.name) : '');
        name = name.trim();
        if (name && !seen[name]) {
          seen[name] = true;
          list.push(name);
        }
      }
      return list;
    }

    function mergeLocalMember() {
      var nick = String(state.nickname || '').trim();
      if (!nick) return;
      if (state.members.indexOf(nick) === -1) {
        state.members.push(nick);
      }
    }

    function getMemberCount() {
      if (typeof state.serverMemberCount === 'number' && !isNaN(state.serverMemberCount) && state.serverMemberCount > 0) {
        return Math.max(state.serverMemberCount, state.members.length);
      }
      return state.members.length;
    }

    function renderMembers() {
      var count = getMemberCount();
      document.getElementById('memberCountBadge').textContent = '参加者 ' + count + '人';

      var box = document.getElementById('memberList');
      box.innerHTML = '';
      if (!state.members.length) {
        var empty = document.createElement('span');
        empty.className = 'notice';
        empty.textContent = state.roomId
          ? 'ニックネームを入力すると参加者一覧に表示されます'
          : 'ルームに入ると参加者が表示されます';
        box.appendChild(empty);
        return;
      }

      for (var i = 0; i < state.members.length; i++) {
        var name = state.members[i];
        var chip = document.createElement('span');
        chip.className = 'member-chip' + (name === state.nickname ? ' member-me' : '');
        chip.textContent = name + (name === state.nickname ? '（あなた）' : '');
        box.appendChild(chip);
      }
    }

    function renderCards() {
      var stage = document.getElementById('cardStage');
      stage.innerHTML = '';
      if (!Array.isArray(state.cards) || !state.cards.length) {
        state.cards = dealHand(state.cardsPerPlayer);
      }

      stage.className = 'card-stage' + (state.cards.length >= 2 ? ' is-multi' : '');

      var allMasked = state.cards.length > 0 && state.cards.every(function (c) { return !!c.masked; });
      document.getElementById('maskAllBtn').textContent = allMasked ? 'すべて見る' : 'すべて隠す';

      for (var i = 0; i < state.cards.length; i++) {
        (function (idx) {
          var item = state.cards[idx];
          var num = Number(item.value) || drawNum();
          item.value = num;

          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'num-box' + (item.masked ? ' is-masked' : '');

          if (item.masked) {
            var badge = document.createElement('span');
            badge.className = 'mask-badge';
            badge.textContent = 'SECRET';
            btn.appendChild(badge);
          } else {
            var tl = document.createElement('span');
            tl.className = 'corner-num corner-tl';
            tl.textContent = String(num);

            var val = document.createElement('span');
            val.className = 'num-val';
            val.textContent = String(num);

            var sub = document.createElement('span');
            sub.className = 'card-sub-label';
            sub.textContent = state.cards.length > 1 ? 'カード' + (idx + 1) + '・タップで隠す' : 'タップで裏返す';

            var br = document.createElement('span');
            br.className = 'corner-num corner-br';
            br.textContent = String(num);

            btn.appendChild(tl);
            btn.appendChild(val);
            btn.appendChild(sub);
            btn.appendChild(br);
          }

          btn.addEventListener('click', function () {
            state.cards[idx].masked = !state.cards[idx].masked;
            renderCards();
          });

          stage.appendChild(btn);
        })(i);
      }
    }

    function render() {
      document.getElementById('gameCount').textContent = state.gameCount;
      document.getElementById('handCountBadge').textContent = state.cardsPerPlayer;
      document.getElementById('roomIdDisp').textContent = state.roomId || '------';
      document.getElementById('themeDisp').textContent = state.theme;

      renderCards();
      renderMembers();

      var numListText = state.cards.map(function (c) { return c.value; }).join(', ');
      var banner = document.getElementById('resultBanner');
      var judgeRow = document.getElementById('judgeRow');
      var nextBtn = document.getElementById('nextBtn');

      if (!state.finished) {
        banner.style.display = 'none';
        banner.className = 'result-banner';
        judgeRow.style.display = 'flex';
        nextBtn.style.display = 'none';
      } else {
        var isOk = state.lastResult === 'success';
        banner.style.display = 'block';
        banner.className = 'result-banner ' + (isOk ? 'result-ok' : 'result-ng');
        banner.textContent = isOk
          ? '第' + state.gameCount + 'ゲーム：成功！次は ' + (state.cardsPerPlayer + 1) + ' 枚になります（あなたの数字: ' + numListText + '）'
          : '第' + state.gameCount + 'ゲーム：失敗…次は 1 枚に戻ります（あなたの数字: ' + numListText + '）';
        judgeRow.style.display = 'none';
        nextBtn.style.display = 'block';
      }
    }

    function applyRoomPayload(data) {
      if (!data || typeof data !== 'object' || data.ok === false) return false;
      if (data.game_count !== undefined && data.game_count !== null) {
        var c = Number(data.game_count);
        if (!isNaN(c) && c >= 1) state.gameCount = c;
      }
      if (data.theme && String(data.theme).trim() !== '') {
        state.theme = String(data.theme).trim();
      }
      if (Array.isArray(data.members) || Array.isArray(data.participants)) {
        state.members = normalizeMembers(data.members || data.participants);
      }
      if (typeof data.member_count === 'number') {
        state.serverMemberCount = data.member_count;
      } else if (typeof data.participant_count === 'number') {
        state.serverMemberCount = data.participant_count;
      } else if (Array.isArray(data.members) || Array.isArray(data.participants)) {
        state.serverMemberCount = state.members.length;
      }
      mergeLocalMember();
      return true;
    }

    function parseJsonSafe(txt) {
      try {
        return JSON.parse(txt);
      } catch (e) {
        return null;
      }
    }

    function callGasGet(roomId) {
      var url = GAS_URL + '?room=' + encodeURIComponent(roomId) + '&_t=' + Date.now();
      if (state.nickname) {
        url += '&nickname=' + encodeURIComponent(state.nickname);
      }
      return fetch(url)
        .then(function (r) { return r.text(); })
        .then(function (t) { return parseJsonSafe(t); });
    }

    function callGasPost(payload) {
      var body = {
        nickname: state.nickname,
        room_id: payload.room_id,
        game_count: payload.game_count,
        action: payload.action || ''
      };
      if (payload.theme !== undefined && payload.theme !== null && String(payload.theme).trim() !== '') {
        body.theme = String(payload.theme).trim();
      }
      return fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      })
        .then(function (r) { return r.text(); })
        .then(function (t) { return parseJsonSafe(t); });
    }

    function startAutoSync() {
      if (syncTimer) clearInterval(syncTimer);
      syncTimer = setInterval(function () {
        if (!state.roomId || isSyncing || document.hidden) return;
        isSyncing = true;
        var targetRoom = state.roomId;
        callGasGet(targetRoom)
          .then(function (data) {
            if (state.roomId === targetRoom && applyRoomPayload(data)) {
              render();
            }
          })
          .catch(function () {})
          .finally(function () { isSyncing = false; });
      }, 3500);
    }

    function enterRoom(id, isCreateMode, keepNumber) {
      var clean = String(id || '').trim().toUpperCase();
      if (!clean) {
        setStatus('ルームIDを入力してください。');
        return;
      }
      if (!state.nickname) {
        var typedNick = document.getElementById('nicknameInput').value.trim();
        if (typedNick) state.nickname = typedNick;
      }

      var mySeq = ++reqSeq;
      var isNewRoom = state.roomId !== clean;
      state.roomId = clean;
      if (isNewRoom) {
        state.members = [];
        state.serverMemberCount = null;
      }
      if (!keepNumber) {
        state.finished = false;
        state.lastResult = null;
        state.cardsPerPlayer = 1;
        state.cards = dealHand(1);
      }
      mergeLocalMember();
      render();
      startAutoSync();
      setStatus('ルーム「' + clean + '」に接続中...', '通信中');

      if (isCreateMode) {
        callGasPost({
          room_id: clean,
          theme: state.theme,
          game_count: state.gameCount,
          action: 'create'
        })
          .then(function (postRes) {
            if (mySeq !== reqSeq) return;
            if (applyRoomPayload(postRes)) {
              render();
              setStatus('ルーム「' + clean + '」を作成しました。', '同期済み');
            } else {
              setStatus('ルーム「' + clean + '」に接続しました。', '確認中');
            }
          })
          .catch(function () {
            if (mySeq !== reqSeq) return;
            render();
            setStatus('通信に失敗しました。時間をおいて再度お試しください。', 'エラー');
          });
        return;
      }

      callGasGet(clean)
        .then(function (data) {
          if (mySeq !== reqSeq) return null;
          var serverHasTheme = data && data.theme && String(data.theme).trim() !== '';
          if (applyRoomPayload(data)) {
            render();
          }
          return callGasPost({
            room_id: clean,
            theme: serverHasTheme ? '' : state.theme,
            game_count: state.gameCount,
            action: 'join'
          });
        })
        .then(function (postRes) {
          if (mySeq !== reqSeq || !postRes) return;
          if (applyRoomPayload(postRes)) {
            render();
          }
          setStatus('ルーム「' + clean + '」に入室しました。', '同期済み');
        })
        .catch(function () {
          if (mySeq !== reqSeq) return;
          render();
          setStatus('通信に失敗しました。時間をおいて再度お試しください。', 'エラー');
        });
    }

    function applyTheme(nextTheme, label) {
      var t = String(nextTheme || '').trim();
      if (!t) return;
      state.theme = t;
      render();

      if (!state.roomId) {
        setStatus((label || 'テーマ') + 'を設定しました。');
        return;
      }

      var mySeq = ++reqSeq;
      setStatus('テーマを共有中...', '通信中');
      callGasPost({
        room_id: state.roomId,
        theme: state.theme,
        game_count: state.gameCount,
        action: 'theme'
      })
        .then(function (res) {
          if (mySeq !== reqSeq) return;
          if (applyRoomPayload(res)) render();
          setStatus('テーマを共有しました。', '同期済み');
        })
        .catch(function () {
          if (mySeq !== reqSeq) return;
          render();
          setStatus('テーマの共有に失敗しました。', 'エラー');
        });
    }

    function copyText(str, okMsg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(str)
          .then(function () { setStatus(okMsg); })
          .catch(function () { setStatus('コピーできませんでした。'); });
      } else {
        setStatus('コピーできませんでした。');
      }
    }

    document.getElementById('nicknameForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var inp = document.getElementById('nicknameInput');
      var nick = inp.value.trim();
      if (!nick) {
        setStatus('ニックネームを入力してください。');
        return;
      }
      state.nickname = nick;
      mergeLocalMember();
      render();

      if (!state.roomId) {
        setStatus('ニックネームを「' + nick + '」に設定しました。');
        return;
      }

      var mySeq = ++reqSeq;
      setStatus('ニックネームを反映中...', '通信中');
      callGasPost({
        room_id: state.roomId,
        theme: '',
        game_count: state.gameCount,
        action: 'join'
      })
        .then(function (res) {
          if (mySeq !== reqSeq) return;
          if (applyRoomPayload(res)) render();
          setStatus('ニックネーム「' + nick + '」を反映しました。', '同期済み');
        })
        .catch(function () {
          if (mySeq !== reqSeq) return;
          render();
          setStatus('ニックネームの反映に失敗しました。', 'エラー');
        });
    });

    document.getElementById('createRoomBtn').addEventListener('click', function () {
      enterRoom(genId(), true, false);
    });

    document.getElementById('joinRoomForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var inp = document.getElementById('joinRoomInput');
      var v = inp.value;
      inp.value = '';
      enterRoom(v, false, false);
    });

    document.getElementById('refreshBtn').addEventListener('click', function () {
      if (!state.roomId) {
        setStatus('先にルームを作成または入室してください。');
        return;
      }
      enterRoom(state.roomId, false, true);
    });

    document.getElementById('drawThemeBtn').addEventListener('click', function () {
      applyTheme(pickRandomTheme(), 'ランダムお題');
    });

    document.getElementById('themeForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var inp = document.getElementById('themeInput');
      var t = inp.value.trim();
      if (!t) return;
      inp.value = '';
      applyTheme(t, 'テーマ');
    });

    document.getElementById('maskAllBtn').addEventListener('click', function () {
      var allMasked = state.cards.length > 0 && state.cards.every(function (c) { return !!c.masked; });
      for (var i = 0; i < state.cards.length; i++) {
        state.cards[i].masked = !allMasked;
      }
      renderCards();
    });

    document.getElementById('successBtn').addEventListener('click', function () {
      state.finished = true;
      state.lastResult = 'success';
      render();
      setStatus('成功！「次のゲームへ」を押すとカードが ' + (state.cardsPerPlayer + 1) + ' 枚になります。');
    });

    document.getElementById('failBtn').addEventListener('click', function () {
      state.finished = true;
      state.lastResult = 'fail';
      render();
      setStatus('「次のゲームへ」を押すと次のゲームに進みます。');
    });

    document.getElementById('nextBtn').addEventListener('click', function () {
      var nextCardsCount = state.lastResult === 'success'
        ? Math.min(5, state.cardsPerPlayer + 1)
        : 1;

      state.gameCount += 1;
      state.cardsPerPlayer = nextCardsCount;
      state.cards = dealHand(nextCardsCount);
      state.finished = false;
      state.lastResult = null;
      state.theme = pickRandomTheme();
      render();

      if (state.roomId) {
        var mySeq = ++reqSeq;
        setStatus('次のゲーム情報を同期中...', '通信中');
        callGasPost({
          room_id: state.roomId,
          theme: state.theme,
          game_count: state.gameCount,
          action: 'next'
        })
          .then(function (res) {
            if (mySeq !== reqSeq) return;
            if (applyRoomPayload(res)) render();
            setStatus('第' + state.gameCount + 'ゲーム（1人 ' + state.cardsPerPlayer + ' 枚）を開始しました。', '同期済み');
          })
          .catch(function () {
            if (mySeq !== reqSeq) return;
            render();
            setStatus('同期に失敗しました。', 'エラー');
          });
      } else {
        setStatus('第' + state.gameCount + 'ゲーム（1人 ' + state.cardsPerPlayer + ' 枚）へ進みました。');
      }
    });

    document.getElementById('copyIdBtn').addEventListener('click', function () {
      if (!state.roomId) {
        setStatus('コピーするルームIDがありません。');
        return;
      }
      copyText(state.roomId, 'ルームID「' + state.roomId + '」をコピーしました。');
    });

    document.getElementById('copyInviteBtn').addEventListener('click', function () {
      if (!state.roomId) {
        setStatus('先にルームを作成してください。');
        return;
      }
      var msg = 'ito風ゲームに参加しよう！\nURL: ' + SHARE_URL + '\nルームID: ' + state.roomId + '\nURLを開いてルームIDを入力して「入る」を押してね';
      copyText(msg, 'URLとルームID入りの招待案内文をコピーしました。');
    });

    render();
  </script>
</body>
</html>
