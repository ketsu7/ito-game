<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ito風 数字並べゲーム</title>
  <style>
    :root {
      --bg: #faf6ee;
      --card: #ffffff;
      --ink: #1e293b;
      --muted: #64748b;
      --border: #1e293b;
      --red: #ef4444;
      --blue: #3b82f6;
      --yellow: #f59e0b;
      --green: #10b981;
    }

    * { box-sizing: border-box; }

    body {
      font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(#e5dec9 1px, transparent 1px);
      background-size: 16px 16px;
      color: var(--ink);
      margin: 0;
      padding: 14px;
      -webkit-tap-highlight-color: transparent;
    }

    .wrap {
      max-width: 460px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ヘッダー */
    .topbar {
      background: var(--card);
      border: 2.5px solid var(--border);
      border-radius: 16px;
      padding: 10px 14px;
      box-shadow: 0 4px 0 var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }
    .topbar::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--red) 0% 25%, var(--yellow) 25% 50%, var(--green) 50% 75%, var(--blue) 75% 100%);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }
    .brand-dots {
      display: inline-flex;
      gap: 3px;
    }
    .brand-dots i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      display: inline-block;
    }

    /* 共通カード */
    .card {
      background: var(--card);
      border: 2.5px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 4px 0 var(--border);
    }

    .row { display: flex; gap: 8px; align-items: center; }
    .col { display: flex; flex-direction: column; gap: 8px; }

    .sec-label {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: 0.4px;
    }

    input {
      flex: 1;
      min-width: 0;
      background: #f8fafc;
      color: var(--ink);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 700;
      outline: none;
    }
    input:focus {
      background: #fffbeb;
      border-color: var(--blue);
    }

    button {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--border);
      transition: transform 0.06s ease, box-shadow 0.06s ease;
    }
    button:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--border);
    }

    .btn-primary {
      background: var(--blue);
      color: #ffffff;
      width: 100%;
      padding: 12px;
      font-size: 15px;
    }
    .btn-sub {
      background: #f1f5f9;
      color: var(--ink);
    }
    .btn-draw {
      background: #fef3c7;
      color: #92400e;
      padding: 6px 11px;
      font-size: 12px;
    }
    .btn-send {
      background: var(--yellow);
      color: var(--ink);
    }
    .btn-ok {
      background: var(--green);
      color: #ffffff;
      flex: 1;
      padding: 13px;
      font-size: 15px;
    }
    .btn-ng {
      background: var(--red);
      color: #ffffff;
      flex: 1;
      padding: 13px;
      font-size: 15px;
    }

    /* バッジ・参加者チップ */
    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      background: #f1f5f9;
      color: var(--ink);
      border: 1.5px solid var(--border);
    }
    .count-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      background: #dbeafe;
      color: #1e40af;
      border: 1.5px solid var(--border);
    }
    .game-pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      background: #fef3c7;
      color: #92400e;
      border: 1.5px solid var(--border);
    }
    .member-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }
    .member-chip {
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      background: #f8fafc;
      border: 1.5px solid var(--border);
      color: var(--ink);
    }
    .member-me {
      background: #fef3c7;
      color: #92400e;
    }

    .notice {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      min-height: 1.2em;
    }

    /* テーマ枠 */
    .theme-card {
      background: #fffdf7;
    }
    .theme-box {
      font-size: 17px;
      font-weight: 900;
      line-height: 1.45;
      padding: 12px;
      background: #fef9c3;
      border: 2px dashed #ca8a04;
      border-radius: 12px;
      color: #422006;
      text-align: center;
    }

    /* ボドゲ風ナンバーカード */
    .card-stage {
      display: flex;
      justify-content: center;
      padding: 8px 0 4px;
    }
    .num-box {
      width: 176px;
      height: 228px;
      border-radius: 20px;
      border: 3px solid var(--border);
      background: #ffffff;
      box-shadow: 0 6px 0 var(--border);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .num-box::after {
      content: "";
      position: absolute;
      inset: 7px;
      border: 1.5px solid #cbd5e1;
      border-radius: 13px;
      pointer-events: none;
    }
    .num-box.is-masked {
      background-color: #ef4444;
      background-image:
        repeating-linear-gradient(45deg, rgba(255,255,255,0.16) 0, rgba(255,255,255,0.16) 8px, transparent 8px, transparent 16px),
        repeating-linear-gradient(-45deg, rgba(255,255,255,0.16) 0, rgba(255,255,255,0.16) 8px, transparent 8px, transparent 16px);
    }
    .num-box.is-masked::after {
      border-color: rgba(255, 255, 255, 0.7);
    }
    .corner-num {
      position: absolute;
      font-size: 15px;
      font-weight: 900;
      color: var(--red);
      line-height: 1;
    }
    .corner-tl { top: 14px; left: 15px; }
    .corner-br { bottom: 14px; right: 15px; transform: rotate(180deg); }
    .num-val {
      font-size: 68px;
      font-weight: 900;
      color: var(--ink);
      line-height: 1;
      letter-spacing: -2px;
    }
    .card-sub-label {
      margin-top: 8px;
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
    }
    .mask-badge {
      background: #ffffff;
      color: var(--red);
      border: 2px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px;
      box-shadow: 0 3px 0 var(--border);
    }

    /* 結果バナー */
    .result-banner {
      margin-top: 12px;
      padding: 11px 12px;
      border-radius: 12px;
      border: 2px solid var(--border);
      font-weight: 900;
      font-size: 14px;
      text-align: center;
      display: none;
    }
    .result-ok {
      background: #d1fae5;
      color: #065f46;
    }
    .result-ng {
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <span class="brand-dots">
          <i style="background:#ef4444;"></i>
          <i style="background:#f59e0b;"></i>
          <i style="background:#10b981;"></i>
          <i style="background:#3b82f6;"></i>
        </span>
        <span>ito風 1-100</span>
      </div>
      <div class="row">
        <span id="memberCountBadge" class="count-pill">参加者 0人</span>
        <span id="badge" class="badge">準備完了</span>
      </div>
    </div>

    <div class="card col" style="gap:10px;">
      <div class="row" style="justify-content: space-between;">
        <span class="sec-label">プレイヤー名</span>
        <span class="game-pill">第 <strong id="gameCount">1</strong> ゲーム</span>
      </div>
      <form id="nicknameForm" class="row">
        <input id="nicknameInput" type="text" maxlength="20" placeholder="ニックネームを入力（例：たくみ）" />
        <button type="submit" class="btn-sub">確定</button>
      </form>
      <div id="memberList" class="member-list"></div>
    </div>

    <div class="card col" style="gap:10px;">
      <div class="row" style="justify-content: space-between;">
        <span class="sec-label">ルーム管理</span>
      </div>
      <button id="createRoomBtn" type="button" class="btn-primary">＋ 新しいルームを作る（6桁ID発行）</button>
      <form id="joinRoomForm" class="row">
        <input id="joinRoomInput" type="text" maxlength="12" placeholder="ルームIDを入力（例：K7M2P9）" />
        <button type="submit" class="btn-sub">入る</button>
      </form>
      <div class="row" style="justify-content: space-between; background:#f8fafc; padding:8px 12px; border-radius:12px; border:1.5px solid #cbd5e1;">
        <div>
          <div style="font-size:11px; font-weight:700; color:var(--muted);">現在のルームID</div>
          <div id="roomIdDisp" style="font-size:19px; font-weight:900; letter-spacing:2px;">------</div>
        </div>
        <div class="row">
          <button id="copyIdBtn" type="button" class="btn-sub" style="padding:8px 10px; font-size:12px;">IDコピー</button>
          <button id="refreshBtn" type="button" class="btn-sub" style="padding:8px 10px; font-size:12px;">最新読込</button>
        </div>
      </div>
      <button id="copyInviteBtn" type="button" class="btn-sub" style="width:100%;">招待案内文をコピー</button>
      <div id="statusMsg" class="notice"></div>
    </div>

    <div class="card theme-card col">
      <div class="row" style="justify-content: space-between;">
        <span class="sec-label">今回のテーマ</span>
        <button id="drawThemeBtn" type="button" class="btn-draw">🎲 お題を引く</button>
      </div>
      <div id="themeDisp" class="theme-box">
        テーマを入力してください
      </div>
      <form id="themeForm" class="row">
        <input id="themeInput" type="text" maxlength="120" placeholder="オリジナルお題を入力" />
        <button type="submit" class="btn-send">送信</button>
      </form>
    </div>

    <div class="card">
      <div class="row" style="justify-content: space-between;">
        <span class="sec-label">あなたのナンバーカード</span>
        <button id="maskBtn" type="button" class="btn-sub" style="padding:6px 11px; font-size:12px;">隠す</button>
      </div>

      <div class="card-stage">
        <button id="cardBtn" type="button" class="num-box">
          <span id="cornerTl" class="corner-num corner-tl">--</span>
          <span id="numVal" class="num-val">--</span>
          <span id="cardSubLabel" class="card-sub-label">タップで裏返す</span>
          <span id="cornerBr" class="corner-num corner-br">--</span>
          <span id="maskVal" class="mask-badge" style="display:none;">SECRET</span>
        </button>
      </div>

      <div id="resultBanner" class="result-banner"></div>

      <div id="judgeRow" class="row" style="margin-top:12px;">
        <button id="successBtn" type="button" class="btn-ok">成功！</button>
        <button id="failBtn" type="button" class="btn-ng">失敗…</button>
      </div>
      <button id="nextBtn" type="button" class="btn-primary" style="display:none; margin-top:12px;">次のゲームへ（お題も更新）</button>
    </div>
  </div>

  <script>
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbzZbmworRZD6ZO4Agg3I5KljhzFOiRqUmN36ahZ2P9lpOY9V-7lXGC5qBNJKiJ9l9Qy/exec';
    var SHARE_URL = 'https://ketsu7.github.io/ito-game/';
    var CHARS = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';

    var THEMES = [
      'スーパー銭湯のあとに飲みたいもの',
      '休日の昼下がりに飲みたいお酒',
      '深夜に食べたくなる背徳グルメ',
      '1000円以内で味わえる最高のご褒美',
      '旅行先で思わず買ってしまうお土産',
      '雨の日に聴きたくなる曲・歌',
      '無人島に1つだけ持っていくなら',
      '小学生のころに憧れていた職業・大人',
      '思わず二度見してしまうファッション・髪型',
      '初対面の人とすぐ打ち解けられる話題',
      '「これがあると生活がちょっと豊かになる」アイテム',
      '寝る前に考えがちで眠れなくなること',
      '漫画やアニメに出てきそうな必殺技・セリフ',
      'ちょっと気まずい沈黙が流れたときの空気感',
      '「これは大人になったな」と感じる瞬間',
      '冬の朝、布団から出られない理由',
      '夏の暑い日に一番うれしい瞬間',
      '居酒屋で最初に頼みがちなメニュー',
      '〆（シメ）に食べたくなるもの',
      'コーヒーや紅茶を飲みたくなるシチュエーション',
      'ちょっとした贅沢を感じる外食',
      '「意外と手間がかかるな…」と思うこと',
      '子どものころ怖かったもの・苦手だったもの',
      '旅先で出会ったらテンションが上がるもの',
      'ボードゲームやカードゲームで盛り上がる瞬間',
      '「これだけは譲れない！」というこだわり',
      '気づいたら時間が溶けていること',
      'ちょっと背伸びしている感じがするお店・注文',
      '友達にすすめたい映画・作品・場所のテンション',
      '「なんだか今日はツイている！」と感じる出来事',
      '逆に「今日は早めに帰ろう…」となる出来事',
      'ギフトにもらったら嬉しいもの',
      '季節の変わり目に感じること',
      '「それ、どういう意味？」とツッコミたくなる一言',
      'レトロ・昭和っぽい雰囲気を感じるもの',
      '未来・SFっぽさを感じるもの',
      '静かに集中したいときに合う環境・音',
      'みんなでワイワイ騒ぎたいときの気分',
      '「実はちょっと苦手かも…」と小声で言いたいこと',
      '明日への活力になる一言・出来事'
    ];

    var state = {
      roomId: '',
      nickname: '',
      members: [],
      serverMemberCount: null,
      theme: THEMES[0],
      lastThemeIndex: 0,
      gameCount: 1,
      number: Math.floor(Math.random() * 100) + 1,
      masked: false,
      finished: false,
      lastResult: null
    };

    var syncTimer = null;
    var isSyncing = false;

    function setStatus(text, badgeText) {
      document.getElementById('statusMsg').textContent = text || '';
      if (badgeText) {
        document.getElementById('badge').textContent = badgeText;
      }
    }

    function genId() {
      var s = '';
      for (var i = 0; i < 6; i++) {
        s += CHARS[Math.floor(Math.random() * CHARS.length)];
      }
      return s;
    }

    function pickRandomTheme() {
      if (THEMES.length <= 1) return THEMES[0] || '';
      var idx = Math.floor(Math.random() * THEMES.length);
      if (idx === state.lastThemeIndex) {
        idx = (idx + 1) % THEMES.length;
      }
      state.lastThemeIndex = idx;
      return THEMES[idx];
    }

    async function applyTheme(nextTheme, sourceLabel) {
      var t = String(nextTheme || '').trim();
      if (!t) return;
      state.theme = t;
      render();

      if (!state.roomId) {
        setStatus((sourceLabel || 'テーマ') + 'を反映しました（ルーム未入室）。');
        return;
      }

      setStatus('テーマを共有中...', '通信中');
      try {
        var res = await callGasPost({
          room_id: state.roomId,
          theme: state.theme,
          game_count: state.gameCount
        });
        applyRoomPayload(res);
        render();
        setStatus('テーマを共有しました。', '同期済み');
      } catch (err) {
        setStatus('テーマ送信エラー: ' + (err && err.message ? err.message : String(err)), 'エラー');
      }
    }

    function normalizeMembers(raw) {
      if (!Array.isArray(raw)) return [];
      var seen = {};
      var list = [];
      for (var i = 0; i < raw.length; i++) {
        var item = raw[i];
        var name = typeof item === 'string' ? item : (item && (item.nickname || item.name) ? String(item.nickname || item.name) : '');
        name = name.trim();
        if (name && !seen[name]) {
          seen[name] = true;
          list.push(name);
        }
      }
      return list;
    }

    function mergeLocalMember() {
      var nick = state.nickname.trim();
      if (!nick) return;
      if (state.members.indexOf(nick) === -1) {
        state.members.push(nick);
      }
    }

    function getMemberCount() {
      if (typeof state.serverMemberCount === 'number' && !isNaN(state.serverMemberCount) && state.serverMemberCount > 0) {
        return Math.max(state.serverMemberCount, state.members.length);
      }
      return state.members.length;
    }

    function renderMembers() {
      var count = getMemberCount();
      document.getElementById('memberCountBadge').textContent = '参加者 ' + count + '人';

      var box = document.getElementById('memberList');
      box.innerHTML = '';
      if (!state.members.length) {
        var empty = document.createElement('span');
        empty.className = 'notice';
        empty.textContent = state.roomId ? 'ニックネームを入力すると参加者一覧に表示されます' : 'ルームに入ると参加者が表示されます';
        box.appendChild(empty);
        return;
      }

      for (var i = 0; i < state.members.length; i++) {
        var name = state.members[i];
        var chip = document.createElement('span');
        chip.className = 'member-chip' + (name === state.nickname ? ' member-me' : '');
        chip.textContent = name + (name === state.nickname ? '（あなた）' : '');
        box.appendChild(chip);
      }
    }

    function render() {
      document.getElementById('gameCount').textContent = state.gameCount;
      document.getElementById('roomIdDisp').textContent = state.roomId || '------';
      document.getElementById('themeDisp').textContent = state.theme;

      var cardBtn = document.getElementById('cardBtn');
      var numVal = document.getElementById('numVal');
      var cornerTl = document.getElementById('cornerTl');
      var cornerBr = document.getElementById('cornerBr');
      var cardSubLabel = document.getElementById('cardSubLabel');
      var maskVal = document.getElementById('maskVal');

      numVal.textContent = state.number;
      cornerTl.textContent = state.number;
      cornerBr.textContent = state.number;

      if (state.masked) {
        cardBtn.classList.add('is-masked');
        numVal.style.display = 'none';
        cornerTl.style.display = 'none';
        cornerBr.style.display = 'none';
        cardSubLabel.style.display = 'none';
        maskVal.style.display = 'inline-block';
      } else {
        cardBtn.classList.remove('is-masked');
        numVal.style.display = 'inline';
        cornerTl.style.display = 'inline';
        cornerBr.style.display = 'inline';
        cardSubLabel.style.display = 'inline';
        maskVal.style.display = 'none';
      }

      document.getElementById('maskBtn').textContent = state.masked ? '見る' : '隠す';
      renderMembers();

      var banner = document.getElementById('resultBanner');
      var judgeRow = document.getElementById('judgeRow');
      var nextBtn = document.getElementById('nextBtn');

      if (!state.finished) {
        banner.style.display = 'none';
        banner.className = 'result-banner';
        judgeRow.style.display = 'flex';
        nextBtn.style.display = 'none';
      } else {
        var isOk = state.lastResult === 'success';
        banner.style.display = 'block';
        banner.className = 'result-banner ' + (isOk ? 'result-ok' : 'result-ng');
        banner.textContent = isOk
          ? '第' + state.gameCount + 'ゲーム：成功！（あなたの数字: ' + state.number + '）'
          : '第' + state.gameCount + 'ゲーム：失敗…（あなたの数字: ' + state.number + '）';
        judgeRow.style.display = 'none';
        nextBtn.style.display = 'block';
      }
    }

    function applyRoomPayload(data) {
      if (!data || typeof data !== 'object') return;
      state.gameCount = Math.max(1, Number(data.game_count) || 1);
      if (data.theme && String(data.theme).trim() !== '') {
        state.theme = String(data.theme).trim();
      }
      if (Array.isArray(data.members) || Array.isArray(data.participants)) {
        state.members = normalizeMembers(data.members || data.participants);
      }
      if (typeof data.member_count === 'number') {
        state.serverMemberCount = data.member_count;
      } else if (typeof data.participant_count === 'number') {
        state.serverMemberCount = data.participant_count;
      } else {
        state.serverMemberCount = state.members.length;
      }
      mergeLocalMember();
    }

    async function callGasGet(roomId) {
      var url = GAS_URL + '?room=' + encodeURIComponent(roomId) + '&_t=' + Date.now();
      if (state.nicknam
