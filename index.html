<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ito風 数字並べゲーム</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
      background: #020617;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    .wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 14px; padding: 14px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    input {
      flex: 1; min-width: 0; background: #020617; color: #fff;
      border: 1px solid #334155; border-radius: 10px; padding: 10px 12px; font-size: 14px;
    }
    button {
      border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 700; font-size: 14px; cursor: pointer;
    }
    .btn-primary { background: #6366f1; color: #fff; width: 100%; padding: 13px; }
    .btn-sub { background: #1e293b; color: #f8fafc; }
    .btn-ok { background: #10b981; color: #022c22; flex: 1; padding: 13px; }
    .btn-ng { background: #f43f5e; color: #fff; flex: 1; padding: 13px; }
    .num-box {
      background: #020617; border: 1px solid #334155; border-radius: 12px;
      height: 130px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      margin-top: 8px; width: 100%;
    }
    .num-val { font-size: 56px; font-weight: 800; color: #818cf8; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #1e293b; color: #a5b4fc; }
    .count-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
      background: #172554; color: #93c5fd; border: 1px solid #1d4ed8;
    }
    .member-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .member-chip {
      font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
      background: #020617; border: 1px solid #334155; color: #e2e8f0;
    }
    .member-me { border-color: #6366f1; color: #c7d2fe; }
    .notice { font-size: 12px; color: #94a3b8; min-height: 1.2em; }
    .result-banner {
      margin-top: 10px; padding: 10px 12px; border-radius: 10px;
      font-weight: 800; font-size: 14px; text-align: center; display: none;
    }
    .result-ok { background: rgba(16, 185, 129, 0.18); border: 1px solid #10b981; color: #6ee7b7; }
    .result-ng { background: rgba(244, 63, 94, 0.18); border: 1px solid #f43f5e; color: #fda4af; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row" style="justify-content: space-between;">
      <strong>ito風 1-100</strong>
      <div class="row">
        <span id="memberCountBadge" class="count-pill">参加者 0人</span>
        <span id="badge" class="badge">準備完了</span>
      </div>
    </div>

    <div class="card col" style="gap:10px;">
      <div class="row" style="justify-content: space-between;">
        <span style="font-size:12px; color:#94a3b8;">あなたのニックネーム</span>
        <span style="font-size:12px;">第 <strong id="gameCount">1</strong> ゲーム</span>
      </div>
      <form id="nicknameForm" class="row">
        <input id="nicknameInput" type="text" maxlength="20" placeholder="ニックネームを入力（例：たくみ）" />
        <button type="submit" class="btn-sub">確定</button>
      </form>
      <div id="memberList" class="member-list"></div>
    </div>

    <div class="card col" style="gap:10px;">
      <div class="row" style="justify-content: space-between;">
        <span style="font-size:12px; color:#94a3b8;">ルーム管理</span>
      </div>
      <button id="createRoomBtn" type="button" class="btn-primary">＋ 新しいルームを作る（6桁ID発行）</button>
      <form id="joinRoomForm" class="row">
        <input id="joinRoomInput" type="text" maxlength="12" placeholder="ルームIDを入力（例：K7M2P9）" />
        <button type="submit" class="btn-sub">入る</button>
      </form>
      <div class="row" style="justify-content: space-between;">
        <div>
          <div style="font-size:11px; color:#94a3b8;">現在のルームID</div>
          <div id="roomIdDisp" style="font-size:18px; font-weight:800; letter-spacing:2px;">------</div>
        </div>
        <div class="row">
          <button id="copyIdBtn" type="button" class="btn-sub">IDコピー</button>
          <button id="refreshBtn" type="button" class="btn-sub">最新読込</button>
        </div>
      </div>
      <button id="copyInviteBtn" type="button" class="btn-sub" style="width:100%;">招待案内文をコピー</button>
      <div id="statusMsg" class="notice"></div>
    </div>

    <div class="card col">
      <div style="font-size:12px; color:#94a3b8;">今回のテーマ</div>
      <div id="themeDisp" style="font-size:16px; font-weight:700; padding:8px; background:#020617; border-radius:8px;">
        テーマを入力してください
      </div>
      <form id="themeForm" class="row">
        <input id="themeInput" type="text" maxlength="120" placeholder="新しいテーマを入力" />
        <button type="submit" class="btn-sub" style="background:#10b981; color:#022c22;">送信</button>
      </form>
    </div>

    <div class="card">
      <div class="row" style="justify-content: space-between;">
        <span style="font-size:12px; color:#94a3b8;">あなたの数字（1〜100）</span>
        <button id="maskBtn" type="button" class="btn-sub">隠す</button>
      </div>
      <button id="cardBtn" type="button" class="num-box">
        <span id="numVal" class="num-val">--</span>
        <span id="maskVal" style="display:none; font-size:20px; font-weight:700; color:#64748b;">● ● ●</span>
      </button>

      <div id="resultBanner" class="result-banner"></div>

      <div id="judgeRow" class="row" style="margin-top:10px;">
        <button id="successBtn" type="button" class="btn-ok">成功</button>
        <button id="failBtn" type="button" class="btn-ng">失敗</button>
      </div>
      <button id="nextBtn" type="button" class="btn-primary" style="display:none; margin-top:10px;">次のゲームへ</button>
    </div>
  </div>

  <script>
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbzZbmworRZD6ZO4Agg3I5KljhzFOiRqUmN36ahZ2P9lpOY9V-7lXGC5qBNJKiJ9l9Qy/exec';
    var SHARE_URL = 'https://ketsu7.github.io/ito-game/';
    var CHARS = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';

    var state = {
      roomId: '',
      nickname: '',
      members: [],
      serverMemberCount: null,
      theme: 'スーパー銭湯のあとに飲みたいもの',
      gameCount: 1,
      number: Math.floor(Math.random() * 100) + 1,
      masked: false,
      finished: false,
      lastResult: null
    };

    function setStatus(text, badgeText) {
      document.getElementById('statusMsg').textContent = text || '';
      if (badgeText) {
        document.getElementById('badge').textContent = badgeText;
      }
    }

    function genId() {
      var s = '';
      for (var i = 0; i < 6; i++) {
        s += CHARS[Math.floor(Math.random() * CHARS.length)];
      }
      return s;
    }

    function normalizeMembers(raw) {
      if (!Array.isArray(raw)) return [];
      var seen = {};
      var list = [];
      for (var i = 0; i < raw.length; i++) {
        var item = raw[i];
        var name = typeof item === 'string' ? item : (item && (item.nickname || item.name) ? String(item.nickname || item.name) : '');
        name = name.trim();
        if (name && !seen[name]) {
          seen[name] = true;
          list.push(name);
        }
      }
      return list;
    }

    function mergeLocalMember() {
      var nick = state.nickname.trim();
      if (!nick) return;
      if (state.members.indexOf(nick) === -1) {
        state.members.push(nick);
      }
    }

    function getMemberCount() {
      if (typeof state.serverMemberCount === 'number' && !isNaN(state.serverMemberCount) && state.serverMemberCount > 0) {
        return Math.max(state.serverMemberCount, state.members.length);
      }
      return state.members.length;
    }

    function renderMembers() {
      var count = getMemberCount();
      document.getElementById('memberCountBadge').textContent = '参加者 ' + count + '人';

      var box = document.getElementById('memberList');
      box.innerHTML = '';
      if (!state.members.length) {
        var empty = document.createElement('span');
        empty.className = 'notice';
        empty.textContent = state.roomId ? 'ニックネームを入力すると参加者一覧に表示されます' : 'ルームに入ると参加者が表示されます';
        box.appendChild(empty);
        return;
      }

      for (var i = 0; i < state.members.length; i++) {
        var name = state.members[i];
        var chip = document.createElement('span');
        chip.className = 'member-chip' + (name === state.nickname ? ' member-me' : '');
        chip.textContent = name + (name === state.nickname ? '（あなた）' : '');
        box.appendChild(chip);
      }
    }

    function render() {
      document.getElementById('gameCount').textContent = state.gameCount;
      document.getElementById('roomIdDisp').textContent = state.roomId || '------';
      document.getElementById('themeDisp').textContent = state.theme;
      document.getElementById('numVal').textContent = state.number;
      document.getElementById('numVal').style.display = state.masked ? 'none' : 'inline';
      document.getElementById('maskVal').style.display = state.masked ? 'inline' : 'none';
      document.getElementById('maskBtn').textContent = state.masked ? '見る' : '隠す';
      renderMembers();

      var banner = document.getElementById('resultBanner');
      var judgeRow = document.getElementById('judgeRow');
      var nextBtn = document.getElementById('nextBtn');

      if (!state.finished) {
        banner.style.display = 'none';
        banner.className = 'result-banner';
        judgeRow.style.display = 'flex';
        nextBtn.style.display = 'none';
      } else {
        var isOk = state.lastResult === 'success';
        banner.style.display = 'block';
        banner.className = 'result-banner ' + (isOk ? 'result-ok' : 'result-ng');
        banner.textContent = isOk
          ? '第' + state.gameCount + 'ゲーム：成功！（あなたの数字: ' + state.number + '）'
          : '第' + state.gameCount + 'ゲーム：失敗…（あなたの数字: ' + state.number + '）';
        judgeRow.style.display = 'none';
        nextBtn.style.display = 'block';
      }
    }

    function applyRoomPayload(data) {
      if (!data || typeof data !== 'object') return;
      state.gameCount = Math.max(1, Number(data.game_count) || 1);
      if (data.theme && String(data.theme).trim() !== '') {
        state.theme = String(data.theme).trim();
      }
      var parsedMembers = normalizeMembers(data.members || data.participants);
      if (parsedMembers.length) {
        state.members = parsedMembers;
      }
      if (typeof data.member_count === 'number') {
        state.serverMemberCount = data.member_count;
      } else if (typeof data.participant_count === 'number') {
        state.serverMemberCount = data.participant_count;
      }
      mergeLocalMember();
    }

    async function callGasGet(roomId) {
      var url = GAS_URL + '?room=' + encodeURIComponent(roomId);
      if (state.nickname) {
        url += '&nickname=' + encodeURIComponent(state.nickname);
      }
      var res = await fetch(url);
      return await res.json();
    }

    async function callGasPost(payload) {
      var body = Object.assign({ nickname: state.nickname }, payload);
      var res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      });
      return await res.json();
    }

    async function enterRoom(id, initialTheme) {
      var clean = String(id || '').trim().toUpperCase();
      if (!clean) {
        setStatus('ルームIDを入力してください。');
        return;
      }
      if (!state.nickname) {
        var typedNick = document.getElementById('nicknameInput').value.trim();
        if (typedNick) {
          state.nickname = typedNick;
        }
      }
      state.roomId = clean;
      state.finished = false;
      state.lastResult = null;
      state.masked = false;
      state.number = Math.floor(Math.random() * 100) + 1;
      mergeLocalMember();
      render();
      setStatus('ルーム「' + clean + '」に接続中...', '通信中');

      try {
        var data = await callGasGet(clean);
        applyRoomPayload(data);
        if ((!data || !data.theme || String(data.theme).trim() === '') && initialTheme) {
          state.theme = initialTheme;
        }
        if (state.nickname) {
          var postRes = await callGasPost({
            room_id: clean,
            theme: state.theme,
            game_count: state.gameCount,
            action: 'join'
          });
          applyRoomPayload(postRes);
        }
        render();
        setStatus('ルーム「' + clean + '」に入室しました。', '同期済み');
      } catch (err) {
        setStatus('通信エラー: ' + (err && err.message ? err.message : String(err)), 'エラー');
      }
    }

    document.getElementById('nicknameForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var inp = document.getElementById('nicknameInput');
      var nick = inp.value.trim();
      if (!nick) {
        setStatus('ニックネームを入力してください。');
        return;
      }
      state.nickname = nick;
      mergeLocalMember();
      render();

      if (!state.roomId) {
        setStatus('ニックネームを「' + nick + '」に設定しました。ルームを作成するか入室してください。');
        return;
      }

      setStatus('ニックネームをルームに反映中...', '通信中');
      try {
        var res = await callGasPost({
          room_id: state.roomId,
          theme: state.theme,
          game_count: state.gameCount,
          action: 'join'
        });
        applyRoomPayload(res);
        render();
        setStatus('ニックネーム「' + nick + '」を反映しました。', '同期済み');
      } catch (err) {
        setStatus('ニックネーム反映エラー: ' + (err && err.message ? err.message : String(err)), 'エラー');
      }
    });

    document.getElementById('createRoomBtn').addEventListener('click', function () {
      enterRoom(genId(), state.theme);
    });

    document.getElementById('joinRoomForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var inp = document.getElementById('joinRoomInput');
      var v = inp.value;
      inp.value = '';
      enterRoom(v, '');
    });

    document.getElementById('refreshBtn').addEventListener('click', function () {
      if (!state.roomId) {
        setStatus('先にルームを作成または入室してください。');
        return;
      }
      enterRoom(state.roomId, '');
    });

    document.getElementById('themeForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var inp = document.getElementById('themeInput');
      var t = inp.value.trim();
      if (!t) return;
      state.theme = t;
      inp.value = '';
      render();

      if (!state.roomId) {
        setStatus('画面のテーマを更新しました（ルーム未入室）。');
        return;
      }

      setStatus('テーマを送信中...', '通信中');
      try {
        var res = await callGasPost({
          room_id: state.roomId,
          theme: state.theme,
          game_count: state.gameCount
        });
        applyRoomPayload(res);
        render();
        setStatus('テーマを共有しました。', '同期済み');
      } catch (err) {
        setStatus('テーマ送信エラー: ' + (err && err.message ? err.message : String(err)), 'エラー');
      }
    });

    function toggleMask() {
      state.masked = !state.masked;
      render();
    }
    document.getElementById('maskBtn').addEventListener('click', toggleMask);
    document.getElementById('cardBtn').addEventListener('click', toggleMask);

    document.getElementById('successBtn').addEventListener('click', function () {
      state.finished = true;
      state.lastResult = 'success';
      render();
      setStatus('「次のゲームへ」を押すと次の回に進みます。');
    });

    document.getElementById('failBtn').addEventListener('click', function () {
      state.finished = true;
      state.lastResult = 'fail';
      render();
      setStatus('「次のゲームへ」を押すと次の回に進みます。');
    });

    document.getElementById('nextBtn').addEventListener('click', async function () {
      state.gameCount += 1;
      state.number = Math.floor(Math.random() * 100) + 1;
      state.masked = false;
      state.finished = false;
      state.lastResult = null;
      render();

      if (state.roomId) {
        setStatus('次のゲーム情報を同期中...', '通信中');
        try {
          var res = await callGasPost({
            room_id: state.roomId,
            theme: state.theme,
            game_count: state.gameCount
          });
          applyRoomPayload(res);
          render();
          setStatus('第' + state.gameCount + 'ゲームを開始しました。', '同期済み');
        } catch (err) {
          setStatus('同期エラー: ' + (err && err.message ? err.message : String(err)), 'エラー');
        }
      }
    });

    async function copyText(str, okMsg) {
      try {
        await navigator.clipboard.writeText(str);
        setStatus(okMsg);
      } catch (e) {
        setStatus('コピーできませんでした: ' + str);
      }
    }

    document.getElementById('copyIdBtn').addEventListener('click', function () {
      if (!state.roomId) { setStatus('コピーするルームIDがありません。'); return; }
      copyText(state.roomId, 'ルームID「' + state.roomId + '」をコピーしました。');
    });

    document.getElementById('copyInviteBtn').addEventListener('click', function () {
      if (!state.roomId) { setStatus('先にルームを作成してください。'); return; }
      var msg = 'ito風ゲームに参加しよう！\nURL: ' + SHARE_URL + '\nルームID: ' + state.roomId + '\nURLを開いてルームIDを入力して「入る」を押してね';
      copyText(msg, 'URLとルームID入りの招待案内文をコピーしました。');
    });

    render();
  </script>
</body>
</html>
