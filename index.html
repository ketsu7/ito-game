<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ito風 数字並べゲーム（通信診断）</title>
  <style>
    :root {
      --bg: #faf6ee;
      --card: #ffffff;
      --ink: #1e293b;
      --muted: #64748b;
      --border: #1e293b;
      --red: #ef4444;
      --blue: #3b82f6;
      --yellow: #f59e0b;
      --green: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      margin: 0;
      padding: 14px;
    }
    .wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: var(--card);
      border: 2.5px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 4px 0 var(--border);
    }
    .row { display: flex; gap: 8px; align-items: center; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    input {
      flex: 1; min-width: 0; background: #f8fafc; color: var(--ink);
      border: 2px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 700;
    }
    button {
      border: 2px solid var(--border); border-radius: 12px; padding: 10px 14px;
      font-weight: 800; font-size: 14px; cursor: pointer; box-shadow: 0 3px 0 var(--border);
    }
    .btn-primary { background: var(--blue); color: #fff; width: 100%; padding: 12px; }
    .btn-sub { background: #f1f5f9; color: var(--ink); }
    .btn-draw { background: #fef3c7; color: #92400e; padding: 6px 11px; font-size: 12px; }
    .btn-send { background: var(--yellow); color: var(--ink); }
    .btn-ok { background: var(--green); color: #fff; flex: 1; padding: 13px; }
    .btn-ng { background: var(--red); color: #fff; flex: 1; padding: 13px; }
    .badge { padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; background: #f1f5f9; border: 1.5px solid var(--border); }
    .count-pill { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background: #dbeafe; color: #1e40af; border: 1.5px solid var(--border); }
    .member-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .member-chip { font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: #f8fafc; border: 1.5px solid var(--border); }
    .member-me { background: #fef3c7; color: #92400e; }
    .theme-box { font-size: 17px; font-weight: 900; padding: 12px; background: #fef9c3; border: 2px dashed #ca8a04; border-radius: 12px; text-align: center; }
    .card-stage { display: flex; justify-content: center; padding: 8px 0; }
    .num-box {
      width: 176px; height: 228px; border-radius: 20px; border: 3px solid var(--border);
      background: #fff; box-shadow: 0 6px 0 var(--border); position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .num-box.is-masked { background: #ef4444; color: #fff; }
    .corner-num { position: absolute; font-size: 15px; font-weight: 900; color: var(--red); }
    .corner-tl { top: 14px; left: 15px; }
    .corner-br { bottom: 14px; right: 15px; transform: rotate(180deg); }
    .num-val { font-size: 68px; font-weight: 900; line-height: 1; }
    .mask-badge { background: #fff; color: var(--red); border: 2px solid var(--border); border-radius: 999px; padding: 6px 14px; font-weight: 900; }
    .notice {
      font-size: 12px; font-weight: 700; color: #0f172a; background: #f1f5f9;
      padding: 8px 10px; border-radius: 10px; border: 1.5px solid #cbd5e1; word-break: break-all;
    }
    .result-banner { margin-top: 12px; padding: 11px; border-radius: 12px; border: 2px solid var(--border); font-weight: 900; text-align: center; display: none; }
    .result-ok { background: #d1fae5; color: #065f46; }
    .result-ng { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card row" style="justify-content: space-between;">
      <strong>ito風 1-100</strong>
      <div class="row">
        <span id="memberCountBadge" class="count-pill">参加者 0人</span>
        <span id="badge" class="badge">準備完了</span>
      </div>
    </div>

    <div class="card col">
      <div class="row" style="justify-content: space-between;">
        <span style="font-size:12px; font-weight:800; color:var(--muted);">プレイヤー名</span>
        <span style="font-size:12px; font-weight:800;">第 <strong id="gameCount">1</strong> ゲーム</span>
      </div>
      <form id="nicknameForm" class="row">
        <input id="nicknameInput" type="text" maxlength="20" placeholder="ニックネームを入力" />
        <button type="submit" class="btn-sub">確定</button>
      </form>
      <div id="memberList" class="member-list"></div>
    </div>

    <div class="card col">
      <button id="createRoomBtn" type="button" class="btn-primary">+ 新しいルームを作る</button>
      <form id="joinRoomForm" class="row">
        <input id="joinRoomInput" type="text" maxlength="12" placeholder="ルームIDを入力" />
        <button type="submit" class="btn-sub">入る</button>
      </form>
      <div class="row" style="justify-content: space-between;">
        <div>
          <div style="font-size:11px; color:var(--muted);">現在のルームID</div>
          <div id="roomIdDisp" style="font-size:19px; font-weight:900; letter-spacing:2px;">------</div>
        </div>
        <div class="row">
          <button id="copyIdBtn" type="button" class="btn-sub">IDコピー</button>
          <button id="refreshBtn" type="button" class="btn-sub">最新読込</button>
        </div>
      </div>
      <button id="copyInviteBtn" type="button" class="btn-sub" style="width:100%;">招待案内文をコピー</button>
      <div id="statusMsg" class="notice">通信ログがここに表示されます</div>
    </div>

    <div class="card col">
      <div class="row" style="justify-content: space-between;">
        <span style="font-size:12px; font-weight:800; color:var(--muted);">今回のテーマ</span>
        <button id="drawThemeBtn" type="button" class="btn-draw">お題を引く</button>
      </div>
      <div id="themeDisp" class="theme-box">スーパー銭湯のあとに飲みたいもの</div>
      <form id="themeForm" class="row">
        <input id="themeInput" type="text" maxlength="120" placeholder="オリジナルお題を入力" />
        <button type="submit" class="btn-send">送信</button>
      </form>
    </div>

    <div class="card">
      <div class="row" style="justify-content: space-between;">
        <span style="font-size:12px; font-weight:800; color:var(--muted);">あなたのナンバーカード</span>
        <button id="maskBtn" type="button" class="btn-sub">隠す</button>
      </div>
      <div class="card-stage">
        <button id="cardBtn" type="button" class="num-box">
          <span id="cornerTl" class="corner-num corner-tl">42</span>
          <span id="numVal" class="num-val">42</span>
          <span id="cornerBr" class="corner-num corner-br">42</span>
          <span id="maskVal" class="mask-badge" style="display:none;">SECRET</span>
        </button>
      </div>
      <div id="resultBanner" class="result-banner"></div>
      <div id="judgeRow" class="row" style="margin-top:12px;">
        <button id="successBtn" type="button" class="btn-ok">成功</button>
        <button id="failBtn" type="button" class="btn-ng">失敗</button>
      </div>
      <button id="nextBtn" type="button" class="btn-primary" style="display:none; margin-top:12px;">次のゲームへ（お題も更新）</button>
    </div>
  </div>

  <script>
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbzZbmworRZD6ZO4Agg3I5KljhzFOiRqUmN36ahZ2P9lpOY9V-7lXGC5qBNJKiJ9l9Qy/exec';
    var SHARE_URL = 'https://ketsu7.github.io/ito-game/';
    var CHARS = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';

    var THEMES = [
      'スーパー銭湯のあとに飲みたいもの',
      '休日の昼下がりに飲みたいお酒',
      '深夜に食べたくなる背徳グルメ',
      '1000円以内で味わえる最高のご褒美',
      '旅行先で思わず買ってしまうお土産',
      '雨の日に聴きたくなる曲や歌',
      '無人島に1つだけ持っていくなら',
      '小学生のころに憧れていた職業や大人',
      '思わず二度見してしまうファッションや髪型',
      '初対面の人とすぐ打ち解けられる話題',
      'これがあると生活がちょっと豊かになるアイテム',
      '寝る前に考えがちで眠れなくなること',
      '漫画やアニメに出てきそうな必殺技やセリフ',
      'ちょっと気まずい沈黙が流れたときの空気感',
      'これは大人になったなと感じる瞬間',
      '冬の朝、布団から出られない理由',
      '夏の暑い日に一番うれしい瞬間',
      '居酒屋で最初に頼みがちなメニュー',
      'シメに食べたくなるもの',
      'コーヒーや紅茶を飲みたくなるシチュエーション',
      'ちょっとした贅沢を感じる外食',
      '意外と手間がかかるなと思うこと',
      '子どものころ怖かったものや苦手なもの',
      '旅先で出会ったらテンションが上がるもの',
      'ボードゲームやカードゲームで盛り上がる瞬間',
      'これだけは譲れないというこだわり',
      '気づいたら時間が溶けていること',
      'ちょっと背伸びしている感じがするお店や注文',
      '友達にすすめたい映画や作品や場所のテンション',
      'なんだか今日はツイていると感じる出来事',
      '今日は早めに帰ろうとなる出来事',
      'ギフトにもらったら嬉しいもの',
      '季節の変わり目に感じること',
      'それどういう意味とツッコミたくなる一言',
      'レトロや昭和っぽい雰囲気を感じるもの',
      '未来やSFっぽさを感じるもの',
      '静かに集中したいときに合う環境や音',
      'みんなでワイワイ騒ぎたいときの気分',
      '実はちょっと苦手かもと小声で言いたいこと',
      '明日への活力になる一言や出来事'
    ];

    function drawNum() { return Math.floor(Math.random() * 100) + 1; }

    var state = {
      roomId: '', nickname: '', members: [], serverMemberCount: null,
      theme: THEMES[0], lastThemeIndex: 0, gameCount: 1,
      number: drawNum(), masked: false, finished: false, lastResult: null
    };
    var syncTimer = null, isSyncing = false, reqSeq = 0;

    function setStatus(text, badgeText) {
      document.getElementById('statusMsg').textContent = text || '';
      if (badgeText) document.getElementById('badge').textContent = badgeText;
    }

    function genId() {
      var s = '';
      for (var i = 0; i < 6; i++) s += CHARS[Math.floor(Math.random() * CHARS.length)];
      return s;
    }

    function pickRandomTheme() {
      if (THEMES.length <= 1) return THEMES[0] || '今回のテーマ';
      var idx = Math.floor(Math.random() * THEMES.length);
      if (idx === state.lastThemeIndex) idx = (idx + 1) % THEMES.length;
      state.lastThemeIndex = idx;
      return THEMES[idx];
    }

    function normalizeMembers(raw) {
      if (!Array.isArray(raw)) return [];
      var seen = {}, list = [];
      for (var i = 0; i < raw.length; i++) {
        var name = typeof raw[i] === 'string' ? raw[i] : (raw[i] && (raw[i].nickname || raw[i].name) ? String(raw[i].nickname || raw[i].name) : '');
        name = name.trim();
        if (name && !seen[name]) { seen[name] = true; list.push(name); }
      }
      return list;
    }

    function mergeLocalMember() {
      var nick = String(state.nickname || '').trim();
      if (nick && state.members.indexOf(nick) === -1) state.members.push(nick);
    }

    function getMemberCount() {
      if (typeof state.serverMemberCount === 'number' && !isNaN(state.serverMemberCount) && state.serverMemberCount > 0) {
        return Math.max(state.serverMemberCount, state.members.length);
      }
      return state.members.length;
    }

    function renderMembers() {
      document.getElementById('memberCountBadge').textContent = '参加者 ' + getMemberCount() + '人';
      var box = document.getElementById('memberList');
      box.innerHTML = '';
      if (!state.members.length) {
        var sp = document.createElement('span');
        sp.style.fontSize = '12px';
        sp.style.color = 'var(--muted)';
        sp.textContent = state.roomId ? 'ニックネームを入力すると参加者一覧に表示されます' : 'ルームに入ると参加者が表示されます';
        box.appendChild(sp);
        return;
      }
      for (var i = 0; i < state.members.length; i++) {
        var chip = document.createElement('span');
        chip.className = 'member-chip' + (state.members[i] === state.nickname ? ' member-me' : '');
        chip.textContent = state.members[i] + (state.members[i] === state.nickname ? '（あなた）' : '');
        box.appendChild(chip);
      }
    }

    function render() {
      var num = Number(state.number) || drawNum();
      state.number = num;
      document.getElementById('gameCount').textContent = state.gameCount;
      document.getElementById('roomIdDisp').textContent = state.roomId || '------';
      document.getElementById('themeDisp').textContent = state.theme;
      document.getElementById('numVal').textContent = String(num);
      document.getElementById('cornerTl').textContent = String(num);
      document.getElementById('cornerBr').textContent = String(num);

      var cardBtn = document.getElementById('cardBtn');
      if (state.masked) {
        cardBtn.classList.add('is-masked');
        document.getElementById('numVal').style.display = 'none';
        document.getElementById('cornerTl').style.display = 'none';
        document.getElementById('cornerBr').style.display = 'none';
        document.getElementById('maskVal').style.display = 'inline-block';
      } else {
        cardBtn.classList.remove('is-masked');
        document.getElementById('numVal').style.display = 'block';
        document.getElementById('cornerTl').style.display = 'block';
        document.getElementById('cornerBr').style.display = 'block';
        document.getElementById('maskVal').style.display = 'none';
      }
      document.getElementById('maskBtn').textContent = state.masked ? '見る' : '隠す';
      renderMembers();

      var banner = document.getElementById('resultBanner');
      if (!state.finished) {
        banner.style.display = 'none';
        document.getElementById('judgeRow').style.display = 'flex';
        document.getElementById('nextBtn').style.display = 'none';
      } else {
        banner.style.display = 'block';
        banner.className = 'result-banner ' + (state.lastResult === 'success' ? 'result-ok' : 'result-ng');
        banner.textContent = '第' + state.gameCount + 'ゲーム：' + (state.lastResult === 'success' ? '成功' : '失敗') + '（数字: ' + num + '）';
        document.getElementById('judgeRow').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'block';
      }
    }

    function applyRoomPayload(data) {
      if (!data || typeof data !== 'object' || data.ok === false) return false;
      if (data.game_count !== undefined && !isNaN(Number(data.game_count)) && Number(data.game_count) >= 1) {
        state.gameCount = Number(data.game_count);
      }
      if (data.theme && String(data.theme).trim() !== '') state.theme = String(data.theme).trim();
      if (Array.isArray(data.members) || Array.isArray(data.participants)) {
        state.members = normalizeMembers(data.members || data.participants);
      }
      if (typeof data.member_count === 'number') state.serverMemberCount = data.member_count;
      else if (Array.isArray(data.members) || Array.isArray(data.participants)) state.serverMemberCount = state.members.length;
      mergeLocalMember();
      return true;
    }

    function requestGas(method, url, bodyObj) {
      var opts = { method: method };
      if (method === 'POST') {
        opts.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
        opts.body = JSON.stringify(bodyObj || {});
      }
      return fetch(url, opts).then(function (r) {
        return r.text().then(function (txt) {
          var parsed = null;
          try { parsed = JSON.parse(txt); } catch (e) {}
          return { status: r.status, raw: txt, json: parsed };
        });
      });
    }

    function callGasGet(roomId) {
      var url = GAS_URL + '?room=' + encodeURIComponent(roomId) + '&_t=' + Date.now();
      if (state.nickname) url += '&nickname=' + encodeURIComponent(state.nickname);
      return requestGas('GET', url, null);
    }

    function callGasPost(payload) {
      var body = {
        nickname: state.nickname,
        room_id: payload.room_id,
        game_count: payload.game_count,
        action: payload.action || ''
      };
      if (payload.theme !== undefined && payload.theme !== null && String(payload.theme).trim() !== '') {
        body.theme = String(payload.theme).trim();
      }
      return requestGas('POST', GAS_URL, body);
    }

    function startAutoSync() {
      if (syncTimer) clearInterval(syncTimer);
      syncTimer = setInterval(function () {
        if (!state.roomId || isSyncing || document.hidden) return;
        isSyncing = true;
        var targetRoom = state.roomId;
        callGasGet(targetRoom)
          .then(function (res) {
            if (state.roomId === targetRoom && res && res.json && applyRoomPayload(res.json)) {
              render();
            }
          })
          .catch(function () {})
          .finally(function () { isSyncing = false; });
      }, 4000);
    }

    function enterRoom(id, isCreateMode, keepNumber) {
      var clean = String(id || '').trim().toUpperCase();
      if (!clean) { setStatus('ルームIDを入力してください。'); return; }
      if (!state.nickname) {
        var typed = document.getElementById('nicknameInput').value.trim();
        if (typed) state.nickname = typed;
      }
      var mySeq = ++reqSeq;
      if (state.roomId !== clean) {
        state.members = [];
        state.serverMemberCount = null;
      }
      state.roomId = clean;
      if (!keepNumber) {
        state.finished = false; state.lastResult = null; state.masked = false; state.number = drawNum();
      }
      mergeLocalMember();
      render();
      startAutoSync();
      setStatus('POST送信中（room=' + clean + '）...', '通信中');

      var stepFn = isCreateMode
        ? callGasPost({ room_id: clean, theme: state.theme, game_count: state.gameCount, action: 'create' })
        : callGasGet(clean).then(function (getRes) {
            if (mySeq !== reqSeq) return null;
            var gJson = getRes && getRes.json ? getRes.json : null;
            var hasTheme = gJson && gJson.theme && String(gJson.theme).trim() !== '';
            if (gJson) applyRoomPayload(gJson);
            render();
            return callGasPost({ room_id: clean, theme: hasTheme ? '' : state.theme, game_count: state.gameCount, action: 'join' });
          });

      stepFn.then(function (res) {
        if (mySeq !== reqSeq || !res) return;
        if (res.json && applyRoomPayload(res.json)) {
          render();
          setStatus('OK (HTTP ' + res.status + '): 参加者=' + JSON.stringify(state.members) + ' / テーマ=' + state.theme, '同期済み');
        } else {
          setStatus('HTTP ' + res.status + ' 応答: ' + String(res.raw || '').slice(0, 180), '要確認');
        }
      }).catch(function (err) {
        if (mySeq !== reqSeq) return;
        render();
        setStatus('通信例外: ' + (err && err.message ? err.message : String(err)), 'エラー');
      });
    }

    function applyTheme(nextTheme, label) {
      var t = String(nextTheme || '').trim();
      if (!t) return;
      state.theme = t;
      render();
      if (!state.roomId) { setStatus((label || 'テーマ') + 'を反映しました（ルーム未入室）。'); return; }
      var mySeq = ++reqSeq;
      setStatus('テーマPOST送信中...', '通信中');
      callGasPost({ room_id: state.roomId, theme: state.theme, game_count: state.gameCount, action: 'theme' })
        .then(function (res) {
          if (mySeq !== reqSeq) return;
          if (res && res.json && applyRoomPayload(res.json)) {
            render();
            setStatus('テーマ同期OK (HTTP ' + res.status + '): ' + state.theme, '同期済み');
          } else {
            setStatus('HTTP ' + (res ? res.status : '') + ' 応答: ' + String(res && res.raw ? res.raw : '').slice(0, 180), '要確認');
          }
        })
        .catch(function (err) {
          if (mySeq !== reqSeq) return;
          setStatus('テーマ通信例外: ' + (err && err.message ? err.message : String(err)), 'エラー');
        });
    }

    function toggleMask() { state.masked = !state.masked; render(); }

    function copyText(str, okMsg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(str).then(function () { setStatus(okMsg); }).catch(function () { setStatus('コピー失敗: ' + str); });
      }
    }

    document.getElementById('nicknameForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var nick = document.getElementById('nicknameInput').value.trim();
      if (!nick) { setStatus('ニックネームを入力してください。'); return; }
      state.nickname = nick;
      mergeLocalMember();
      render();
      if (!state.roomId) { setStatus('ニックネーム「' + nick + '」を設定しました。'); return; }
      var mySeq = ++reqSeq;
      setStatus('ニックネームPOST送信中...', '通信中');
      callGasPost({ room_id: state.roomId, theme: '', game_count: state.gameCount, action: 'join' })
        .then(function (res) {
          if (mySeq !== reqSeq) return;
          if (res && res.json && applyRoomPayload(res.json)) {
            render();
            setStatus('名前同期OK (HTTP ' + res.status + '): ' + JSON.stringify(state.members), '同期済み');
          } else {
            setStatus('HTTP ' + (res ? res.status : '') + ' 応答: ' + String(res && res.raw ? res.raw : '').slice(0, 180), '要確認');
          }
        })
        .catch(function (err) {
          if (mySeq !== reqSeq) return;
          setStatus('名前通信例外: ' + (err && err.message ? err.message : String(err)), 'エラー');
        });
    });

    document.getElementById('createRoomBtn').addEventListener('click', function () { enterRoom(genId(), true, false); });
    document.getElementById('joinRoomForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var inp = document.getElementById('joinRoomInput');
      var v = inp.value; inp.value = '';
      enterRoom(v, false, false);
    });
    document.getElementById('refreshBtn').addEventListener('click', function () {
      if (!state.roomId) { setStatus('先にルームを作成または入室してください。'); return; }
      enterRoom(state.roomId, false, true);
    });
    document.getElementById('drawThemeBtn').addEventListener('click', function () { applyTheme(pickRandomTheme(), 'ランダムお題'); });
    document.getElementById('themeForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var inp = document.getElementById('themeInput');
      var t = inp.value.trim(); if (!t) return; inp.value = '';
      applyTheme(t, 'テーマ');
    });
    document.getElementById('maskBtn').addEventListener('click', toggleMask);
    document.getElementById('cardBtn').addEventListener('click', toggleMask);
    document.getElementById('successBtn').addEventListener('click', function () { state.finished = true; state.lastResult = 'success'; render(); });
    document.getElementById('failBtn').addEventListener('click', function () { state.finished = true; state.lastResult = 'fail'; render(); });
    document.getElementById('nextBtn').addEventListener('click', function () {
      state.gameCount += 1; state.number = drawNum(); state.masked = false; state.finished = false; state.lastResult = null;
      state.theme = pickRandomTheme();
      render();
      if (state.roomId) {
        var mySeq = ++reqSeq;
        setStatus('次のゲームPOST送信中...', '通信中');
        callGasPost({ room_id: state.roomId, theme: state.theme, game_count: state.gameCount, action: 'next' })
          .then(function (res) {
            if (mySeq !== reqSeq) return;
            if (res && res.json && applyRoomPayload(res.json)) {
              render();
              setStatus('次ゲーム同期OK (HTTP ' + res.status + '): 第' + state.gameCount + 'ゲーム', '同期済み');
            } else {
              setStatus('HTTP ' + (res ? res.status : '') + ' 応答: ' + String(res && res.raw ? res.raw : '').slice(0, 180), '要確認');
            }
          })
          .catch(function (err) {
            if (mySeq !== reqSeq) return;
            setStatus('次ゲーム通信例外: ' + (err && err.message ? err.message : String(err)), 'エラー');
          });
      }
    });
    document.getElementById('copyIdBtn').addEventListener('click', function () {
      if (!state.roomId) return;
      copyText(state.roomId, 'ルームID「' + state.roomId + '」をコピーしました。');
    });
    document.getElementById('copyInviteBtn').addEventListener('click', function () {
      if (!state.roomId) return;
      copyText('ito風ゲームに参加しよう！\nURL: ' + SHARE_URL + '\nルームID: ' + state.roomId, '招待案内文をコピーしました。');
    });

    render();
  </script>
</body>
</html>
