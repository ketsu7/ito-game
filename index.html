<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>テスト版</title>
</head>
<body style="background:#0f172a;color:#fff;font-family:sans-serif;padding:24px;">
  <h1>動作テスト</h1>
  <p id="status">待機中</p>
  <button id="testBtn" style="padding:12px 20px;font-size:16px;">押してテスト</button>
  <div id="numBox" style="font-size:48px;margin-top:20px;">--</div>

  <script>
    document.getElementById('status').textContent = 'JSは正常に動いています！';
    document.getElementById('testBtn').addEventListener('click', function () {
      var n = Math.floor(Math.random() * 100) + 1;
      document.getElementById('numBox').textContent = n;
      document.getElementById('status').textContent = 'ボタン押下OK: ' + n;
    });
  </script>
</body>
</html>
